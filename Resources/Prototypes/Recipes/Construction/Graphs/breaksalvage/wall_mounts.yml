- type: constructionGraph
  id: SalvageWallpipes
  start: closedCover
  graph:
  - node: closedCover
    entity: SalvageWallpipeCoverClosed
    edges:
    - to: unscrewedCover
      steps:
      - tool: Screwing
        doAfter: 2
  - node: unscrewedCover
    entity: SalvageWallpipeCoverUnscrewed
    edges:
    - to: wallcoverSilver3
      steps:
      - tool: Prying
        doAfter: 2
  - node: wallcoverSilver3
    entity: SalvageWallpipeSilver3
    edges:
    - to: wallcoverSilver2
      completed:
      - !type:GivePrototype
        prototype: SalvageSilverPipe
        amount: 1
      steps:
      - tool: Anchoring
        doAfter: 2
  - node: wallcoverSilver2
    entity: SalvageWallpipeSilver2
    edges:
    - to: wallcoverSilver1
      completed:
      - !type:GivePrototype
        prototype: SalvageSilverPipe
        amount: 1
      steps:
      - tool: Anchoring
        doAfter: 2
  - node: wallcoverSilver1
    entity: SalvageWallpipeSilver1
    edges:
    - to: wallcoverEmpty
      completed:
      - !type:GivePrototype
        prototype: SalvageSilverPipe
        amount: 1
      steps:
      - tool: Anchoring
        doAfter: 2
  - node: wallcoverEmpty
    entity: SalvageWallpipeEmpty
    actions:
    - !type:AppearanceChange

